# Reverse proxy for Stokes-Pulse.
# Drop this in /etc/nginx/sites-available/stokes-pulse.conf on your NGINX box,
# then:  ln -s /etc/nginx/sites-available/stokes-pulse.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx

upstream stokespulse {
    server 10.10.43.9:8420;
    keepalive 8;
}

server {
    listen 80;
    server_name stokespulse.home;   # pick any hostname you'll resolve via PiHole/DNS, or use the bare IP

    # --- optional: require a login (recommended since the app itself has none) ---
    # 1. Generate a credentials file once:  htpasswd -c /etc/nginx/.stokespulse.htpasswd randall
    # 2. Uncomment the two lines below.
    # auth_basic           "Stokes-Pulse";
    # auth_basic_user_file /etc/nginx/.stokespulse.htpasswd;

    location / {
        proxy_pass http://stokespulse;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep-alive to the upstream (matches the "upstream" block above)
        proxy_set_header Connection "";

        # the dashboard polls every ~15s; defaults are fine, but a little headroom doesn't hurt
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}

