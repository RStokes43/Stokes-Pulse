<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>{{ app_name }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("stokespulse-theme") || "midnight-blue";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    html, body {
      margin: 0;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    .m-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
    }
    .m-header .brand-name { font-weight: 700; font-size: 17px; flex: 1; }
    .m-icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .m-segmented {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 65px;
      z-index: 9;
    }
    .m-seg-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 20px;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .m-seg-btn.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
    .m-content { padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
    .m-hero {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .m-hero .status-word { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
    .m-hero .status-word.up { color: var(--up); }
    .m-hero .status-word.degraded { color: var(--degraded); }
    .m-hero .status-word.down { color: var(--down); }
    .m-hero .status-sub { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }
    .m-group { margin-bottom: 18px; }
    .m-group h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin: 0 0 8px;
      padding: 0 2px;
    }
    .m-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .m-card.status-down { border-color: var(--down); }
    .m-card.status-degraded { border-color: var(--degraded); }
    .m-card .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .m-card .dot.status-up { background: var(--up); box-shadow: 0 0 6px var(--up); }
    .m-card .dot.status-degraded { background: var(--degraded); box-shadow: 0 0 6px var(--degraded); }
    .m-card .dot.status-down { background: var(--down); box-shadow: 0 0 6px var(--down); }
    .m-card .info { flex: 1; min-width: 0; }
    .m-card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-card .ip { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
    .m-card .metrics { text-align: right; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
    .m-card .metrics .latency { display: block; font-family: var(--mono); }
    .m-event {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .m-event .ev-device { font-weight: 700; display: block; margin-bottom: 3px; }
    .m-event .ev-meta { color: var(--text-dim); font-size: 12px; }
    .m-empty { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="m-header">
    <svg viewBox="0 0 24 24" width="16" height="16" id="m-logo-dot"><circle cx="12" cy="12" r="10" fill="var(--up)"/></svg>
    <span class="brand-name">{{ app_name }}</span>
    <form method="post" action="/logout" style="margin:0">
      <button class="m-icon-btn" type="submit" title="Log out">&#9211;</button>
    </form>
  </header>
  <nav class="m-segmented">
    <button class="m-seg-btn active" data-view="status">Status</button>
    <button class="m-seg-btn" data-view="events">Events</button>
  </nav>
  <main class="m-content">
    <div id="m-view-status"></div>
    <div id="m-view-events" hidden></div>
  </main>
  <script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
</body>
</html>
