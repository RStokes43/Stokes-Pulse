<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>{{ app_name }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("stokespulse-theme") || "midnight-blue";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    html, body {
      margin: 0;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    .m-header {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
    }
    .m-header .brand-name { font-weight: 700; font-size: 17px; flex: 1; }
    .m-icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .m-actions { display: flex; gap: 8px; position: relative; }
    .m-content { padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }

    /* Drawer nav */
    .m-drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 20; }
    .m-drawer-backdrop[hidden] { display: none; }
    .m-drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: min(280px, 80vw);
      background: var(--bg-elev);
      border-right: 1px solid var(--border);
      z-index: 21;
      padding: calc(16px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .m-drawer[hidden] { display: none; }
    .m-drawer-brand { font-weight: 700; font-size: 16px; padding: 4px 10px 16px; }
    .m-drawer-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 14px 10px 6px; }
    .m-drawer-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 12px 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .m-drawer-item.active { background: var(--accent-glow); color: var(--accent); }
    .m-drawer-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }

    /* Dashboard */
    .m-hero {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .m-hero .status-word { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
    .m-hero .status-word.up { color: var(--up); }
    .m-hero .status-word.degraded { color: var(--degraded); }
    .m-hero .status-word.down { color: var(--down); }
    .m-hero .status-sub { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }
    .m-group { margin-bottom: 18px; }
    .m-group h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin: 0 0 8px;
      padding: 0 2px;
    }
    .m-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .m-card.status-down { border-color: var(--down); }
    .m-card.status-degraded { border-color: var(--degraded); }
    .m-card .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .m-card .dot.status-up { background: var(--up); box-shadow: 0 0 6px var(--up); }
    .m-card .dot.status-degraded { background: var(--degraded); box-shadow: 0 0 6px var(--degraded); }
    .m-card .dot.status-down { background: var(--down); box-shadow: 0 0 6px var(--down); }
    .m-card .info { flex: 1; min-width: 0; }
    .m-card .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-card .ip { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
    .m-card .metrics { text-align: right; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
    .m-card .metrics .latency { display: block; font-family: var(--mono); }
    .m-card .pause-btn { flex-shrink: 0; }
    .m-event {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .m-event .ev-device { font-weight: 700; display: block; margin-bottom: 3px; }
    .m-event .ev-meta { color: var(--text-dim); font-size: 12px; }
    .m-empty { color: var(--text-dim); text-align: center; padding: 40px 20px; font-size: 13px; }
    .m-content .panel { margin-bottom: 16px; }
    .m-content .data-table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <header class="m-header">
    <button class="m-icon-btn" id="drawer-btn" title="Menu">&#9776;</button>
    <svg viewBox="0 0 24 24" width="16" height="16" id="m-logo-dot"><circle cx="12" cy="12" r="10" fill="var(--up)"/></svg>
    <span class="brand-name">{{ app_name }}</span>
    <div class="m-actions">
      <button class="icon-btn" id="theme-btn" title="Theme">&#127912;</button>
      <div class="theme-picker-popover" id="theme-popover" hidden></div>
      <button class="m-icon-btn" id="help-btn" title="Help">?</button>
    </div>
  </header>

  <div class="m-drawer-backdrop" id="drawer-backdrop" hidden></div>
  <nav class="m-drawer" id="m-drawer" hidden>
    <div class="m-drawer-brand">{{ app_name }}</div>

    <div class="m-drawer-label">Monitor</div>
    <button class="m-drawer-item active" data-section="dashboard">Dashboard</button>
    <button class="m-drawer-item" data-section="topology">Topology</button>

    <div class="m-drawer-label">Insights</div>
    <button class="m-drawer-item" data-section="analytics">Analytics</button>
    <button class="m-drawer-item" data-section="events">Event Log</button>
    <button class="m-drawer-item" data-section="impact">Impact</button>

    {% if is_admin %}
    <div class="m-drawer-label">Admin</div>
    <button class="m-drawer-item" data-section="maintenance">Maintenance</button>
    <button class="m-drawer-item" data-section="settings">Settings</button>
    <button class="m-drawer-item" data-section="users">Users</button>
    {% endif %}

    <div class="m-drawer-footer">
      <button class="m-drawer-item" id="changelog-item">Changelog (v0)</button>
      <form method="post" action="/logout" style="margin:0">
        <button class="btn secondary" type="submit" style="width:100%;margin-top:8px">Log out</button>
      </form>
    </div>
  </nav>

  <main class="m-content" id="m-content"></main>

  <div class="modal" id="help-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Help</h2>
        <button class="icon-btn" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>

  <div class="modal" id="changelog-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Changelog</h2>
        <button class="icon-btn" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="changelog-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/help.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
</body>
</html>
