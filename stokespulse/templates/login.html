<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — {{ app_name }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("stokespulse-theme") || "midnight-blue";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { width: min(360px, 90vw); text-align: center; }
    .auth-card h1 { font-size: 18px; margin: 0 0 4px; }
    .auth-card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
    .auth-error { color: var(--down); font-size: 13px; margin-bottom: 16px; }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 16px;
      background: #fff;
      color: #1f1f1f;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
    .google-btn:hover { background: #f4f4f4; }
  </style>
</head>
<body>
  <div class="panel auth-card">
    <h1>{{ app_name }}</h1>
    <div class="sub">Sign in to continue</div>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <a class="google-btn" href="{{ google_url }}">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.18.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </a>
  </div>
</body>
</html>
