<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("stokespulse-theme") || "midnight-blue";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo-dot" id="logo-dot" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10"/></svg>
      <span class="brand-name">{{ app_name }}</span>
    </div>
    <div class="health-banner" id="health-banner">Loading…</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-btn" title="Theme">&#127912;</button>
      <div class="theme-picker-popover" id="theme-popover" hidden></div>
      <button class="icon-btn" id="help-btn" title="Help">?</button>
    </div>
  </header>

  <nav class="nav-toplevel" id="nav-toplevel">
    <button class="nav-fn active" data-function="monitor">Monitor</button>
    <button class="nav-fn" data-function="insights">Insights</button>
    <button class="nav-fn" data-function="admin">Admin</button>
  </nav>
  <nav class="nav-sublevel" id="nav-sublevel">
    <div class="subgroup" data-group="monitor">
      <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
      <button class="nav-tab" data-tab="topology">Topology</button>
    </div>
    <div class="subgroup" data-group="insights" hidden>
      <button class="nav-tab active" data-tab="analytics">Analytics</button>
      <button class="nav-tab" data-tab="events">Event Log</button>
      <button class="nav-tab" data-tab="impact">Impact</button>
    </div>
    <div class="subgroup" data-group="admin" hidden>
      <button class="nav-tab active" data-tab="maintenance">Maintenance</button>
      <button class="nav-tab" data-tab="settings">Settings</button>
    </div>
  </nav>

  <main class="content">
    <div>
      <section class="tab-panel" id="tab-dashboard"><div id="dashboard-root"></div></section>
      <section class="tab-panel" id="tab-topology" hidden><div id="topology-root"></div></section>
      <section class="tab-panel" id="tab-analytics" hidden><div id="analytics-root"></div></section>
      <section class="tab-panel" id="tab-events" hidden><div id="events-root"></div></section>
      <section class="tab-panel" id="tab-impact" hidden><div id="impact-root"></div></section>
      <section class="tab-panel" id="tab-maintenance" hidden><div id="maintenance-root"></div></section>
      <section class="tab-panel" id="tab-settings" hidden><div id="settings-root"></div></section>
    </div>
    <aside class="summary-sidebar" id="summary-sidebar"></aside>
  </main>

  <button class="changelog-fab" id="changelog-fab" title="View changelog">v0</button>

  <div class="modal" id="help-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Help</h2>
        <button class="icon-btn" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>

  <div class="modal" id="changelog-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Changelog</h2>
        <button class="icon-btn" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="changelog-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/topology.js') }}"></script>
  <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
  <script src="{{ url_for('static', filename='js/events.js') }}"></script>
  <script src="{{ url_for('static', filename='js/impact.js') }}"></script>
  <script src="{{ url_for('static', filename='js/maintenance.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/help.js') }}"></script>
  <script>StokesPulse.init();</script>
</body>
</html>
