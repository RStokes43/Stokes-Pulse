name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
      - "!android/dist/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/stokes-pulse.apk

      - name: Commit APK back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/dist/stokes-pulse.apk
          if git diff --staged --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "Build Android APK [skip ci]"
            git push
          fi
